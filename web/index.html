<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>加菲猫的工作室</title>
<script>
/* 前端自查：放在所有外部脚本之前，才能赶上“脚本根本加载不下来”。
   页面能打开却什么都点不动，几乎都是脚本没跑：浏览器太旧（IE / 兼容模式，
   现代语法直接 SyntaxError），或 .js 被服务端当成 text/plain 发出而被 nosniff
   拦下。这里既在页面上弹提示，也回传 /api/client-log 落盘到
   .agent/logs/app.log —— 离线机带不回来控制台，日志是唯一证据。 */
(function () {
  var sent = 0;
  function post(kind, message, extra) {
    if (sent >= 8) return;
    sent++;
    try {
      fetch('/api/client-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({
          kind: kind, message: String(message || ''),
          url: location.href, ua: navigator.userAgent
        }, extra || {}))
      }).catch(function () {});
    } catch (e) {}
  }
  window.__wbReport = post;
  function show(msg, detail) {
    if (document.getElementById('bootFail')) return;
    var d = document.createElement('div');
    d.id = 'bootFail';
    d.style.cssText = 'position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:99999;' +
      'max-width:min(640px,92vw);background:#fff5f6;color:#8a1c26;border:1px solid #e7a9af;' +
      'border-radius:12px;padding:14px 18px;font:13px/1.7 -apple-system,"Microsoft YaHei",sans-serif;' +
      'box-shadow:0 10px 30px rgba(120,20,30,.18)';
    d.innerHTML = '<b>' + msg + '</b>' +
      (detail ? '<div style="margin-top:8px;font-size:12px;color:#a1494f">' + detail + '</div>' : '');
    (document.body || document.documentElement).appendChild(d);
  }
  // 脚本加载失败（404 / MIME 被拦 / 网络中断）：点名是哪个文件
  window.addEventListener('error', function (e) {
    var t = e.target || {};
    if (t.tagName === 'SCRIPT') {
      show('前端脚本没能加载：' + String(t.src || '').split('/').pop(),
        '按钮点不动就是因为这个。详细原因已写入日志：工作台目录下 .agent/logs/app.log。');
      post('script-load', 'script failed: ' + (t.src || ''));
      return;
    }
    if (e.message) {
      show('页面脚本报错，部分功能可能不可用：' + e.message,
        '详细堆栈已写入 .agent/logs/app.log。');
      post('js-error', e.message, { source: e.filename, line: e.lineno, col: e.colno,
        extra: e.error && e.error.stack ? String(e.error.stack).slice(0, 1500) : '' });
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason || {};
    post('promise', (r && r.message) || String(r));
  });
  // 脚本都执行过还是没有启动标记：多半是前半段脚本没跑/报错了
  setTimeout(function () {
    if (window.__wbBooted) return;
    show('页面脚本没有运行起来，所以所有按钮都点不动。',
      '请先用新版 Chrome / Edge（非 IE、非“兼容模式”）打开本页；' +
      '失败原因已写入 .agent/logs/app.log，把它发回来就能定位。');
    post('boot-failed', '__wbBooted 未置位（脚本未执行或报错）', {
      source: '',
      extra: 'scripts=' + [].map.call(document.querySelectorAll('script[src]'),
        function (s) { return String(s.src).split('/').pop(); }).join(',')
    });
  }, 2500);
})();
</script>

        <span class="ap-ops">
          <button id="btnZipArts" class="btn ghost small" title="打包本会话全部产出物为 zip 下载"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg> 打包下载</button>
          <button id="btnHideArts" class="btn ghost small" title="隐藏产出物面板">收起</button>
        </span></div>
      <div id="artifactList" class="ap-list"></div>
    </section>
  </aside>
</div>

<div id="modalMask" class="hidden"></div>
<div id="modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-head"><span id="modalTitle"></span><button id="modalClose" class="btn ghost small" aria-label="关闭"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div id="modalBody"></div>
</div>

<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<!-- 读屏提示：只播报「回复完成/失败」这类结论，不播报逐字流式内容 -->
<div id="a11yLive" class="sr-only" role="status" aria-live="polite"></div>

<!-- 命令面板（Ctrl/Cmd + K） -->
<div id="palette" class="hidden">
  <div class="pal-mask"></div>
  <div class="pal-panel">
    <div class="pal-search">
      <span class="pal-ic">⌘</span>
      <input id="palQ" type="text" placeholder="输入命令或搜索…（↑↓ 选择，Enter 执行，Esc 关闭）" autocomplete="off" spellcheck="false">
    </div>
    <div id="palList" class="pal-list"></div>
    <div class="pal-foot muted">Ctrl / ⌘ + K 命令面板 · Ctrl+B / Ctrl+J 收放侧栏 · Esc 停止 · Ctrl+L 聚焦输入 · ↑ 编辑上一条</div>
  </div>
</div>
